name: Update fixtures

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Read the DMBB, DLBB and Basketball Ireland fixture pages
        run: python3 tools/update_fixtures.py
      - name: Save the new fixtures if anything changed
        run: |
          git config user.name "Éanna Hub fixtures bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/eanna-fixtures.json
          git diff --cached --quiet || git commit -m "Weekly fixtures and results update"
          git push
